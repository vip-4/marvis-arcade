<style>
  :root{--bg:oklch(17% .02 90);--fg:oklch(92% .02 90);--cell:oklch(27% .03 90);--ac:oklch(78% .15 80);--dim:oklch(62% .025 90)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  h1{font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  #hud{display:flex;gap:22px;font-size:.9rem;font-variant-numeric:tabular-nums}
  #hud b{color:var(--ac)}
  .board{background:oklch(23% .03 90);border-radius:12px;padding:12px;box-shadow:0 22px 55px -22px oklch(4% .06 90);touch-action:none}
  .grid{display:grid;grid-template-columns:repeat(4,72px);gap:10px}
  .tile{width:72px;height:72px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-family:system-ui;font-size:1.6rem;background:var(--cell);color:oklch(90% .02 90);transition:transform .15s ease-out,background .15s}
  .tile[data-v="2"]{background:oklch(42% .05 90)}
  .tile[data-v="4"]{background:oklch(48% .07 80)}
  .tile[data-v="8"]{background:oklch(58% .12 60);font-size:1.5rem}
  .tile[data-v="16"]{background:oklch(64% .15 50);font-size:1.4rem}
  .tile[data-v="32"]{background:oklch(66% .18 40);font-size:1.4rem}
  .tile[data-v="64"]{background:oklch(68% .19 32);font-size:1.3rem}
  .tile[data-v="128"],.tile[data-v="256"],.tile[data-v="512"],.tile[data-v="1024"],.tile[data-v="2048"]{background:linear-gradient(140deg,oklch(72% .18 55),oklch(70% .17 75));font-size:1.2rem}
  #msg{position:fixed;inset:0;display:none;place-items:center;background:oklch(10% .02 90/.75);font-size:1.5rem;text-align:center}
  #msg.show{display:grid}
  #msg button{position:absolute;margin-top:120px;padding:12px 28px;border:0;border-radius:10px;background:var(--ac);color:#1a1a1a;font-weight:700;cursor:pointer;font-size:1rem}
  .hint{color:var(--dim);font-size:.78rem}
  kbd{background:oklch(30% .03 90);padding:2px 7px;border-radius:5px;font-size:.72rem}

<body>
<h1>2048 · 数字合并</h1>
<div id="hud"><span>得分 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
<div class="board"><div class="grid" id="grid"></div></div>
<div class="hint"><kbd>WASD</kbd>/<kbd>方向键</kbd> · 触屏滑动</div>
<div id="msg"><div id="msgTxt"></div><button onclick="reset()">重新开始</button></div>
<script>
(function(){
  var SIZE=4,gridEl=document.getElementById('grid'),grid=[];
  var score=0,best=+localStorage.getItem('g2048.best')||0;
  document.getElementById('best').textContent=best;
  var tiles=[];
  function init(){
    grid=Array.from({length:SIZE},function(){return Array(SIZE).fill(0);});
    score=0;document.getElementById('score').textContent=0;
    document.getElementById('msg').classList.remove('show');
    addTile();addTile();render();
  }
  function addTile(){
    var empty=[];
    for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++)if(!grid[y][x])empty.push([x,y]);
    if(!empty.length)return;
    var p=empty[(Math.random()*empty.length)|0];
    grid[p[1]][p[0]]=Math.random()<0.9?2:4;
  }
  function render(){
    gridEl.innerHTML='';
    for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++){
      var d=document.createElement('div');
      d.className='tile';d.dataset.v=grid[y][x];
      d.textContent=grid[y][x]||'';
      if(!grid[y][x])d.style.color='transparent';
      gridEl.appendChild(d);
    }
    if(!canMove()){document.getElementById('msgTxt').textContent='GAME OVER · '+score;document.getElementById('msg').classList.add('show');}
    if(!grid.reduce(function(a,r){return a||r.some(function(v){return v>=2048;});},false)===false){}
  }
  function slide(row){
    var f=row.filter(function(v){return v;});
    for(var i=0;i<f.length-1;i++){
      if(f[i]===f[i+1]){f[i]*=2;score+=f[i];f.splice(i+1,1);}
    }
    while(f.length<SIZE)f.push(0);
    return f;
  }
  function move(dir){
    var moved=false;
    for(var i=0;i<SIZE;i++){
      var row;
      if(dir===0)row=grid[i].slice();           // left
      else if(dir===1)row=grid[i].slice().reverse(); // right
      else if(dir===2)row=grid.map(function(r){return r[i];}); // up
      else row=grid.map(function(r){return r[i];}).reverse(); // down
      var before=row.join(',');
      var ns=slide(row);
      if(dir===1)ns.reverse();else if(dir===3)ns.reverse();
      if(ns.join(',')!==before){
        if(dir===0)grid[i]=ns;
        else if(dir===1)grid[i]=ns;
        else if(dir===2)for(var k=0;k<SIZE;k++)grid[k][i]=ns[k];
        else for(var k=0;k<SIZE;k++)grid[k][i]=ns[k];
        moved=true;
      }
    }
    return moved;
  }
  function canMove(){
    for(var y=0;y<SIZE;y++)for(var x=0;x<SIZE;x++){
      if(!grid[y][x])return true;
      if(x<SIZE-1&&grid[y][x]===grid[y][x+1])return true;
      if(y<SIZE-1&&grid[y][x]===grid[y+1][x])return true;
    }
    return false;
  }
  function turn(dir){
    if(document.getElementById('msg').classList.contains('show'))return;
    if(!move(dir))return;
    addTile();render();
    if(score>best){best=score;localStorage.setItem('g2048.best',best);}
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
  }
  addEventListener('keydown',function(e){
    var m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,a:0,d:1,w:2,s:3};
    var k=e.key.length>1?e.key:e.key.toLowerCase();
    if(m[k]!==undefined){turn(m[k]);e.preventDefault();}
  });
  var sx=null,sy=null;
  document.querySelector('.board').addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  document.querySelector('.board').addEventListener('touchend',function(e){
    if(sx==null)return;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<16&&Math.abs(dy)<16)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:0);else turn(dy>0?3:2);
    sx=sy=null;
  },{passive:true});
  window.reset=init;
  init();
})();
</script>
