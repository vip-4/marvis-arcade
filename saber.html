<h1>Open Saber · 四向斩击</h1>
<div id="hud"><span>得分 <b id="score">0</b></span><span>连击 <b id="combo">0</b></span><span>生命 <b id="lives">3</b></span><span>时间 <b id="time">60</b></span><span>最高 <b id="best">0</b></span></div>
<div id="stage"><div class="ring"></div><div class="core"></div><div id="fx">PERFECT</div></div>
<div id="keys"><button class="k" data-d="0">◀</button><button class="k" data-d="1">▼</button><button class="k" data-d="2">▲</button><button class="k" data-d="3">▶</button></div>
<div class="hint">方块从四方向你袭来，<kbd>方向键</kbd>/<kbd>WASD</kbd> 朝箭头同向挥刀 · 触屏点按四向按钮</div>
<div id="msg">TIME UP / GAME OVER<div id="final"></div><button onclick="restart()">再来一局</button></div>
<script>
(function(){
  var stage=document.getElementById('stage'),scoreEl=document.getElementById('score'),
      comboEl=document.getElementById('combo'),livesEl=document.getElementById('lives'),
      timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),
      fxEl=document.getElementById('fx'),msgEl=document.getElementById('msg'),finalEl=document.getElementById('final');
  var S=300,C=S/2,HIT=44; // hit radius px around core
  var best=+localStorage.getItem('saber.best')||0;bestEl.textContent=best;
  var blocks=[],score=0,combo=0,lives=3,time=60,playing=false,raf=null;
  var parts=[];
  function spawn(){
    var d=(Math.random()*4)|0;
    var b={d:d,x:C,y:C,t0:performance.now(),k:(Math.random()*1.4+.7),dead:false};
    blocks.push(b);renderBlock(b);
  }
  function renderBlock(b){
    var el=document.createElement('div');el.className='blk';
    el.textContent=['◀','▼','▲','▶'][b.d];
    el.style.background=['#ffd27f','#7fd9ff','#8fff9f','#ff9fb5'][b.d];
    b.el=el;stage.appendChild(el);
  }
  var dirVec=[[-1,0],[0,1],[0,-1],[1,0]];
  function swing(d){
    if(!playing)return;
    var hit=null,bb=1e9;
    for(var i=0;i<blocks.length;i++){var b=blocks[i];if(b.dead)continue;var r=Math.hypot(b.x-C,b.y-C);if(r<=HIT&&Math.abs(r-bb)<10){hit=b;bb=r;break;}}
    if(hit&&hit.d===d){
      hit.dead=true;combo++;score+=10+combo*5;
      scoreEl.textContent=score;comboEl.textContent=combo;
      fx('+'+combo,'perfect');burst(hit.x,hit.y);
      if(--hit.el.parentNode)hit.el.remove();
    }else{
      fx('MISS','miss');
      if(lives>0){lives--;livesEl.textContent=lives;if(lives<=0)end();}
    }
  }
  function burst(x,y){
    for(var i=0;i<8;i++){
      var a=i/8*Math.PI*2,p={x:x,y:y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,life:16};
      parts.push(p);
      var d=document.createElement('div');d.style.cssText='position:absolute;width:5px;height:5px;border-radius:50%;background:'+bcolor(0)+';pointer-events:none;z-index:4';p.el=d;stage.appendChild(d);
    }
  }
  function bcolor(i){return ['#ffd27f','#ffffff','#8fff9f','#7fd9ff'][i&3];}
  function fx(txt,cls){fxEl.textContent=txt;fxEl.className='show '+cls;clearTimeout(fx._t);fxEl._t=setTimeout(function(){fxEl.className='';},150);}
  function step(){
    if(!playing)return;
    var now=performance.now();
    for(var i=blocks.length-1;i>=0;i--){
      var b=blocks[i];if(b.dead)continue;
      var dx=dirVec[b.d][0],dy=dirVec[b.d][1];
      b.x+=dx*b.k*1.6;b.y+=dy*b.k*1.6;
      b.el.style.left=(b.x-15)+'px';b.el.style.top=(b.y-15)+'px';
      if(Math.hypot(b.x-C,b.y-C)<10&&!b.reached){ // reached core
        b.reached=true;b.dead=true;b.el.remove();
        fx('MISS','miss');beep(180,.15,'sawtooth');
        combo=0;comboEl.textContent=0;
        if(--lives<=0)end();livesEl.textContent=Math.max(0,lives);
      }
    }
    for(var j=parts.length-1;j>=0;j--){var p=parts[j];p.life--;if(p.life<=0){p.el.remove();parts.splice(j,1);continue;}p.x+=p.vx;p.y+=p.vy;p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.el.style.opacity=p.life/16;}
    // timer
    var tLeft=Math.max(0,60-Math.floor((now-tStart)/1000));
    if(tLeft!==time){time=tLeft;timeEl.textContent=time;if(time<=0)end();}
    raf=requestAnimationFrame(step);
  }
  var audioCtx=null,tStart=0;
  function beep(f,d,ty){if(!audioCtx)return;var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}
  function end(){
    playing=false;cancelAnimationFrame(raf);
    if(score>best){best=score;localStorage.setItem('saber.best',best);}
    finalEl.textContent='得分 '+score+' · 最高 '+best;
    msgEl.classList.add('show');
  }
  function restart(){
    blocks.forEach(function(b){if(b.el)b.el.remove();});blocks=[];parts.forEach(function(p){if(p.el)p.el.remove();});parts=[];
    score=0;combo=0;lives=3;time=60;scoreEl.textContent=0;comboEl.textContent=0;livesEl.textContent=3;timeEl.textContent=60;
    msgEl.classList.remove('show');
    if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    playing=true;tStart=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(step);
    spawn();setTimeout(spawn,650);setTimeout(spawn,1250);
  }
  addEventListener('keydown',function(e){
    var m={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3,a:0,s:1,w:2,d:3};
    var k=e.key.length>1?e.key:e.key.toLowerCase();
    if(k in m){e.preventDefault();swing(m[k]);}
    if((k===' '||k==='r')&&!playing){restart();}
  });
  document.querySelectorAll('.k').forEach(function(b){b.addEventListener('pointerdown',function(){swing(+b.dataset.d);});});
  var spawnIdle=null;
  var spawner=setInterval(function(){if(playing)spawn();},1000);
  restart();
})();
</script>
