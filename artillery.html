<h1>Artillery · 炮兵对决</h1>
<div id="hud"><span>得分 <b id="score">0</b></span><span>命中 <b id="hitc">0</b></span><span>风 <b id="wind">0</b></span><span>最高 <b id="best">0</b></span></div>
<canvas id="cv" width="640" height="360"></canvas>
<div class="ctrl">
  <label>角度 <b id="angV">45°</b></label><input id="ang" type="range" min="5" max="85" value="45">
  <label>力度 <b id="powV">60</b></label><input id="pow" type="range" min="20" max="100" value="60">
  <button class="fire" id="fire">开火</button>
  <label><kbd>←→</kbd> 角度 · <kbd>↑↓</kbd> 力度 · <kbd>空格</kbd> 开火</label>
</div>
<div class="hint">抛物线带风阻：风向影响弹道。命中目标+100 分并刷新目标位置</div>
<div id="msg">时间到 / 胜利<div id="final"></div><button onclick="restart()">再来一局</button></div>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var scoreEl=document.getElementById('score'),hitcEl=document.getElementById('hitc'),
      windEl=document.getElementById('wind'),bestEl=document.getElementById('best'),
      angI=document.getElementById('ang'),powI=document.getElementById('pow'),
      angV=document.getElementById('angV'),powV=document.getElementById('powV'),
      msgEl=document.getElementById('msg'),finalEl=document.getElementById('final');
  var best=+localStorage.getItem('artillery.best')||0;bestEl.textContent=best;
  var W=640,H=360,GROUND=300,G=0.24;
  var score=0,hitc=0,wind=0,ball=null,trail=[],playing=true,t=0,gameT=0;
  var gun={x:80},target=null;
  var elapsed=0,timeSec=60;
  function respawnTarget(){
    target={x:450+Math.random()*140,y:GROUND-26,life:1};
  }
  function newRound(){wind=(Math.random()*2-1)*0.9;wind=+wind.toFixed(2);windEl.textContent=wind;respawnTarget();}
  function fire(){
    if(!playing||ball)return;
    var a=(+angI.value)*Math.PI/180,p=+powI.value*0.42;
    ball={x:gun.x,y:GROUND,cos:Math.cos(a)*p,vy:-Math.sin(a)*p};
    trail=[];
  }
  function step(){
    // frame
    if(ball){
      ball.x+=ball.cos;ball.vy+=G;ball.x+=wind*0.35;
      ball.y+=ball.vy;
      trail.push([ball.x,ball.y]);if(trail.length>90)trail.shift();
      // hit ground -> boom
      if(ball.y>=GROUND){
        ball=null;
      }
      // hit target
      if(target&&Math.hypot(ball.x-target.x,ball.y-target.y)<22){
        score+=100;hitc++;scoreEl.textContent=score;hitcEl.textContent=hitc;
        if(score>best){best=score;localStorage.setItem('artillery.best',best);}
        bestEl.textContent=best;ball=null;newRound();
      }
    }
    // timer
    elapsed=(performance.now()-t0)/1000;
    gameT=Math.max(0,60-Math.floor(elapsed));
    if(gameT<=0&&playing){timeUp();}
  }
  function timeUp(){
    playing=false;
    finalEl.textContent='60s 结束 · 得分 '+score+' · 最高 '+best;
    msgEl.classList.add('show');
  }
  function draw(){
    ctx.fillStyle='oklch(24% .03 245)';ctx.fillRect(0,0,W,H);
    // sky tint
    ctx.fillStyle='oklch(30% .04 250)';ctx.fillRect(0,0,W,GROUND-40);
    // ground
    ctx.fillStyle='var(--grass)';ctx.fillRect(0,GROUND,W,H-GROUND);
    // gun
    ctx.fillStyle='oklch(60% .04 245)';ctx.fillRect(gun.x-8,GROUND-30,16,30);
    var a=(+angI.value)*Math.PI/180;
    ctx.strokeStyle='var(--fg)';ctx.lineWidth=6;ctx.beginPath();
    ctx.moveTo(gun.x,GROUND-30);ctx.lineTo(gun.x+Math.cos(a)*26,GROUND-30-Math.sin(a)*26);ctx.stroke();
    // wind flag
    ctx.fillStyle='var(--dim)';ctx.font='13px system-ui';ctx.textAlign='left';
    ctx.fillText(wind>0?'风 → 右':'风 ← 左',10,22);
    // trail
    ctx.strokeStyle='oklch(70% .2 70)';ctx.lineWidth=2;ctx.beginPath();
    trail.forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});ctx.stroke();
    // ball
    if(ball){ctx.fillStyle='var(--ac)';ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,7);ctx.fill();}
    // target
    if(target){ctx.fillStyle='oklch(72% .18 20)';ctx.fillRect(target.x-16,target.y-4,32,8);ctx.fillRect(target.x-4,target.y-14,8,14);}
    // timer
    ctx.fillStyle='var(--ac)';ctx.font='16px system-ui';ctx.textAlign='right';
    ctx.fillText('⏱ '+gameT+'s',W-10,24);
  }
  var t0=0,raf=null;
  function loop(){step();draw();raf=requestAnimationFrame(loop);}
  function restart(){
    score=0;hitc=0;scoreEl.textContent=0;hitcEl.textContent=0;playing=true;
    msgEl.classList.remove('show');ball=null;trail=[];
    newRound();t0=performance.now();
  }
  angI.addEventListener('input',function(){angV.textContent=angI.value+'°';});
  powI.addEventListener('input',function(){powV.textContent=powI.value;});
  document.getElementById('fire').addEventListener('click',fire);
  addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){angI.value=Math.max(5,+angI.value-3);angV.textContent=angI.value+'°';e.preventDefault();}
    if(e.key==='ArrowRight'){angI.value=Math.min(85,+angI.value+3);angV.textContent=angI.value+'°';e.preventDefault();}
    if(e.key==='ArrowUp'){powI.value=Math.min(100,+powI.value+3);powV.textContent=powI.value;e.preventDefault();}
    if(e.key==='ArrowDown'){powI.value=Math.max(20,+powI.value-3);powV.textContent=powI.value;e.preventDefault();}
    if(e.key===' '){e.preventDefault();fire();}
    if(e.key==='r'){restart();}
  });
  msgEl.addEventListener('click',restart);
  restart();loop();
})();
</script>
