<h1>Polygonfall · 多边形堆叠</h1>
<div id="hud"><span>得分 <b id="score">0</b></span><span>消行 <b id="lines">0</b></span><span>等级 <b id="lvl">1</b></span><span>最高 <b id="best">0</b></span></div>
<canvas id="cv" width="220" height="400"></canvas>
<div class="hint"><kbd>←→</kbd> 移动 · <kbd>↑</kbd> 旋转 · <kbd>↓</kbd> 速降 · <kbd>空格</kbd> 直落 · 触屏滑动/点按底部</div>
<div id="msg">GAME OVER<div id="final"></div><button onclick="restart()">再来一局</button></div>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var scoreEl=document.getElementById('score'),linesEl=document.getElementById('lines'),
      lvlEl=document.getElementById('lvl'),bestEl=document.getElementById('best'),
      msgEl=document.getElementById('msg'),finalEl=document.getElementById('final');
  var best=+localStorage.getItem('polygons.best')||0;bestEl.textContent=best;
  var COLS=10,ROWS=20,CELL=22;
  var board,cur,drop=800,id,score=0,linesTotal=0,level=1,over=false;
  // pieces: array of blocks [shape, colorIdx]. shapes are small grids
  var COLORS=['oklch(76% .14 75)','oklch(76% .14 150)','oklch(72% .16 250)','oklch(74% .16 350)','oklch(76% .13 60)','oklch(70% .15 290)'];
  var SHAPES=[
    [[1,1],[1,1]],                    // square
    [[0,1,0],[1,1,1]],                // T
    [[1,0,0],[1,1,1]],                // L
    [[0,0,1],[1,1,1]],                // J
    [[0,1,1],[1,1,0]],                // S
    [[1,1,0],[0,1,1]],                // Z
    [[1,1,1,1]],                      // I
    [[1,1,0],[0,1,0],[0,1,0]],        // bend
    [[1,0],[1,1],[1,0]]               // U-ish mini
  ];
  function newBoard(){board=[];for(var y=0;y<ROWS;y++){var r=[];for(var x=0;x<COLS;x++)r.push(0);board.push(r);}}
  function spawn(){
    var s=SHAPES[(Math.random()*SHAPES.length)|0];
    var ci=(Math.random()*COLORS.length)|0;
    cur={shape:s,ci:ci,x:(COLS-Math.max(s[0].length,s.length))/2|0,y:0};
    if(collide(cur))over=true;
  }
  function rotate(shape){var r=[];for(var x=0;x<shape[0].length;x++){var row=[];for(var y=shape.length-1;y>=0;y--)row.push(shape[y][x]);r.push(row);}return r;}
  function collide(p){for(var y=0;y<p.shape.length;y++)for(var x=0;x<p.shape[y].length;x++){if(!p.shape[y][x])continue;var bx=p.x+x,by=p.y+y;if(bx<0||bx>=COLS||by>=ROWS)return true;if(by>=0&&board[by][bx])return true;}return false;}
  function move(dx,dy){var p={shape:cur.shape,ci:cur.ci,x:cur.x+dx,y:cur.y+dy};if(!collide(p)){cur=p;return true;}return false;}
  function rot(){var p={shape:rotate(cur.shape),ci:cur.ci,x:cur.x,y:cur.y};if(!collide(p))cur=p;else{var kw=[[-1],[1],[-2],[2],[-1,1]];for(var i=0;i<kw.length;i++){for(var j=0;j<kw[i].length;j++){var q={shape:p.shape,ci:p.ci,x:p.x+kw[i][j],y:p.y};if(!collide(q)){cur=q;return;}}}}}
  function dropNow(){while(move(0,1)){}lock();}
  function lock(){
    for(var y=0;y<cur.shape.length;y++)for(var x=0;x<cur.shape[y].length;x++){if(cur.shape[y][x]){var by=cur.y+y,bx=cur.x+x;if(by>=0)board[by][bx]=cur.ci+1;}}
    // clear full rows
    var cleared=0;
    for(var yy=ROWS-1;yy>=0;yy--){if(board[yy].every(function(c){return c;})){board.splice(yy,1);board.unshift(new Array(COLS).fill(0));cleared++;yy++;}}
    if(cleared){linesTotal+=cleared;linesEl.textContent=linesTotal;score+=cleared*100*level;scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem('polygons.best',best);}bestEl.textContent=best;}
    if(++level<12){lvlEl.textContent=level;drop=Math.max(170,800-level*55);}
    spawn();if(over)end();
  }
  function tick(){if(over)return;if(!move(0,1)){lock();}draw();}
  function draw(){
    ctx.fillStyle='oklch(22% .03 120)';ctx.fillRect(0,0,cv.width,cv.height);
    // grid
    ctx.strokeStyle='oklch(28% .03 120)';ctx.lineWidth=1;
    for(var x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,cv.height);ctx.stroke();}
    for(var y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL+.5);ctx.lineTo(cv.width,y*CELL+.5);ctx.stroke();}
    for(var yy=0;yy<ROWS;yy++)for(var xx=0;xx<COLS;xx++){if(board[yy][xx]){drawPoly(xx*CELL+CELL/2,yy*CELL+CELL/2,board[yy][xx]-1,6);}}
    if(cur&&!over){
      for(var yy2=0;yy2<cur.shape.length;yy2++)for(var xx2=0;xx2<cur.shape[yy2].length;xx2++){
        if(cur.shape[yy2][xx2])drawPoly((cur.x+xx2)*CELL+CELL/2,(cur.y+yy2)*CELL+CELL/2,cur.ci,6);
      }
    }
  }
  function drawPoly(cx,cy,ci,sides){
    ctx.fillStyle=COLORS[ci%COLORS.length];
    ctx.beginPath();
    for(var i=0;i<sides;i++){
      var a=i/sides*Math.PI*2-Math.PI/2;
      var px=cx+Math.cos(a)*9,py=cy+Math.sin(a)*9;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();ctx.fill();
    // rotate sides based on shape type: use shape's "polygon-ness" via ci alternation
  }
  function end(){over=true;clearInterval(id);finalEl.textContent='得分 '+score+' · 消行 '+linesTotal+' · 最高 '+best;msgEl.classList.add('show');}
  function restart(){
    score=0;linesTotal=0;level=1;drop=800;over=false;newBoard();
    scoreEl.textContent=0;linesEl.textContent=0;lvlEl.textContent=1;msgEl.classList.remove('show');
    spawn();
    clearInterval(id);id=setInterval(tick,drop);
  }
  addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){move(-1,0);e.preventDefault();}
    if(e.key==='ArrowRight'){move(1,0);e.preventDefault();}
    if(e.key==='ArrowUp'){rot();e.preventDefault();}
    if(e.key==='ArrowDown'&&!over){move(0,1);e.preventDefault();}
    if(e.key===' '){e.preventDefault();dropNow();}
    if(e.key==='r')restart();
    draw();
  });
  // touch: swipe to move, tap to rotate
  var tx=null;
  cv.addEventListener('touchstart',function(e){var t=e.touches[0];tx=t.clientX;e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    var dx=t.clientX-tx;
    if(Math.abs(dx)>12){move(dx>0?1:-1,0);tx=t.clientX;draw();}
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('click',function(){if(!over){rot();draw();}});
  restart();
  setInterval(function(){if(!over)draw();},33);
})();
</script>
